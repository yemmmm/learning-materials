<svg xmlns="http://www.w3.org/2000/svg" width="1696" height="650" viewBox="0 0 1696 650" class="architecture-diagram" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">OntoWeave 系统架构（当前 direct modeling）</title>
  <desc id="architecture-desc">展示外部业务人员、建模 Team、消费 Agent、独立验收与 OntoWeave 平台接口、服务、存储和外部业务系统的边界。规划区域仅作为待确认占位。</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2c7053" stroke-width="1.6"/></marker>
    <marker id="arrow-ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#9c6c36" stroke-width="1.6"/></marker>
    <style>
      .architecture-diagram text { font-family: 'Deck Sans', sans-serif; fill: #16382e; }
      .architecture-diagram .title { font-size: 28px; font-weight: 700; }
      .architecture-diagram .boundary { fill: #f5f3ec; stroke: #16382e; stroke-width: 3; }
      .architecture-diagram .lane { fill: #f0f2eb; stroke: #bfccbf; stroke-width: 1.5; }
      .architecture-diagram .lane.alt { fill: #e1e9dc; }
      .architecture-diagram .lane-label { font-size: 22px; font-weight: 700; fill: #617068; }
      .architecture-diagram .node { fill: #f5f3ec; stroke: #2c7053; stroke-width: 2; }
      .architecture-diagram .node.soft { fill: #e1e9dc; }
      .architecture-diagram .node.direct { fill: #d7e7d0; stroke: #16382e; stroke-width: 3; }
      .architecture-diagram .node.external { fill: #eee4d3; stroke: #9c6c36; stroke-width: 2; }
      .architecture-diagram .node.future { fill: #eee4d3; stroke: #9c6c36; stroke-width: 2; stroke-dasharray: 8 7; }
      .architecture-diagram .node-title { font-size: 24px; text-anchor: middle; }
      .architecture-diagram .node-title.small { font-size: 22px; }
      .architecture-diagram .node-title.tiny { font-size: 21px; }
      .architecture-diagram .node-title.bold { font-weight: 700; }
      .architecture-diagram .subtle { font-size: 21px; fill: #617068; }
      .architecture-diagram .label { font-size: 21px; fill: #617068; paint-order: stroke; stroke: #f5f3ec; stroke-width: 10px; stroke-linejoin: round; text-anchor: middle; }
      .architecture-diagram .edge { fill: none; stroke: #2c7053; stroke-width: 2; marker-end: url(#arrow-green); }
      .architecture-diagram .edge.ochre { stroke: #9c6c36; marker-end: url(#arrow-ochre); }
      .architecture-diagram .edge.dashed { stroke-dasharray: 8 7; }
      .architecture-diagram .edge-label-ochre { fill: #9c6c36; }
      .architecture-diagram .team { fill: #e1e9dc; stroke: #2c7053; stroke-width: 2; }
      .architecture-diagram .business { fill: #eee4d3; stroke: #9c6c36; stroke-width: 2; }
      .architecture-diagram .acceptance-boundary { fill: #f5f3ec; stroke: #2c7053; stroke-width: 2; stroke-dasharray: 8 7; }
      .architecture-diagram .legend { font-size: 21px; fill: #617068; }
    </style>
  </defs>
  <rect width="1696" height="650" fill="#f5f3ec"/>
  <rect x="360" y="70" width="980" height="510" rx="14" class="boundary"/>
  <text x="385" y="101" class="lane-label" style="fill:#16382e">ONTOWEAVE 平台边界</text>
  <rect x="380" y="120" width="940" height="125" rx="6" class="lane alt"/>
  <rect x="380" y="265" width="940" height="165" rx="6" class="lane"/>
  <rect x="380" y="450" width="940" height="120" rx="6" class="lane alt"/>
  <text x="397" y="146" class="lane-label">接口入口</text>
  <text x="397" y="291" class="lane-label">应用服务</text>
  <text x="397" y="476" class="lane-label">平台数据</text>

  <rect x="20" y="35" width="330" height="78" rx="10" class="node future"/>
  <text x="185" y="63" class="node-title tiny bold" style="fill:#9c6c36"><tspan x="185">远期设想｜待实现·规划待确认</tspan><tspan x="185" dy="26">跨阶段调度 · 运行管理界面</tspan></text>
  <rect x="20" y="125" width="330" height="72" rx="10" class="node external"/>
  <text x="185" y="153" class="node-title"><tspan x="185">业务人员</tspan><tspan x="185" dy="28" class="subtle">确认含义与范围</tspan></text>

  <rect x="20" y="220" width="330" height="290" rx="10" class="team"/>
  <rect x="20" y="220" width="330" height="38" rx="10" class="team"/>
  <text x="185" y="245" class="node-title small bold">建模 Team · 生产协作边界</text>
  <rect x="40" y="272" width="130" height="72" rx="8" class="node"/>
  <text x="105" y="297" class="node-title tiny"><tspan x="105">Modeling</tspan><tspan x="105" dy="23" class="subtle">语义建模</tspan></text>
  <rect x="190" y="272" width="130" height="72" rx="8" class="node"/>
  <text x="255" y="297" class="node-title tiny"><tspan x="255">Coordinator</tspan><tspan x="255" dy="23" class="subtle">范围与依赖</tspan></text>
  <rect x="40" y="360" width="130" height="72" rx="8" class="node"/>
  <text x="105" y="385" class="node-title tiny"><tspan x="105">CQ</tspan><tspan x="105" dy="23" class="subtle">能力问题</tspan></text>
  <rect x="190" y="360" width="130" height="72" rx="8" class="node"/>
  <text x="255" y="385" class="node-title tiny"><tspan x="255">Delivery</tspan><tspan x="255" dy="23" class="subtle">授权与进度</tspan></text>
  <text x="40" y="465" class="subtle">Team 做语义判断；平台守边界</text>

  <rect x="420" y="170" width="220" height="75" rx="10" class="node"/>
  <text x="530" y="201" class="node-title"><tspan x="530">管理界面</tspan><tspan x="530" dy="28" class="subtle">React / Vite</tspan></text>
  <rect x="680" y="170" width="220" height="75" rx="10" class="node"/>
  <text x="790" y="201" class="node-title"><tspan x="790">HTTP 接口</tspan><tspan x="790" dy="28" class="subtle">FastAPI</tspan></text>
  <rect x="950" y="170" width="280" height="75" rx="10" class="node"/>
  <text x="1090" y="201" class="node-title"><tspan x="1090">Agent 工具接口</tspan><tspan x="1090" dy="28" class="subtle">FastMCP</tspan></text>

  <rect x="425" y="325" width="220" height="95" rx="10" class="node soft"/>
  <text x="535" y="361" class="node-title"><tspan x="535">授权与范围</tspan><tspan x="535" dy="28" class="subtle">Project / Ontology</tspan></text>
  <rect x="690" y="305" width="330" height="125" rx="10" class="node direct"/>
  <text x="855" y="340" class="node-title bold"><tspan x="855">直接模型变更</tspan><tspan x="855" dy="28" class="subtle">compiler → apply_atomic</tspan><tspan x="855" dy="28" class="subtle">回执与实际修订</tspan></text>
  <rect x="1060" y="325" width="230" height="95" rx="10" class="node soft"/>
  <text x="1175" y="361" class="node-title"><tspan x="1175">语义查询与读取</tspan><tspan x="1175" dy="28" class="subtle">治理范围 / IRI 周边</tspan></text>

  <rect x="450" y="490" width="300" height="75" rx="10" class="node"/>
  <text x="600" y="518" class="node-title small"><tspan x="600">PostgreSQL</tspan><tspan x="600" dy="24" class="subtle">元数据、工作状态、回执</tspan></text>
  <rect x="860" y="490" width="360" height="75" rx="10" class="node"/>
  <text x="1040" y="518" class="node-title small"><tspan x="1040">RDF / Oxigraph</tspan><tspan x="1040" dy="24" class="subtle">权威业务语义图</tspan></text>

  <rect x="1370" y="120" width="290" height="240" rx="10" class="business"/>
  <rect x="1370" y="120" width="290" height="42" rx="10" class="business"/>
  <text x="1515" y="148" class="node-title small bold">外部业务系统</text>
  <rect x="1395" y="190" width="240" height="62" rx="8" class="node" style="stroke:#9c6c36"/>
  <text x="1515" y="215" class="node-title tiny"><tspan x="1515">业务数据库</tspan><tspan x="1515" dy="24" class="subtle">订单、商品等业务行</tspan></text>
  <rect x="1395" y="263" width="240" height="62" rx="8" class="node" style="stroke:#9c6c36"/>
  <text x="1515" y="288" class="node-title tiny"><tspan x="1515">业务 API</tspan><tspan x="1515" dy="24" class="subtle">状态查询与业务执行</tspan></text>
  <rect x="1370" y="375" width="290" height="75" rx="10" class="node external"/>
  <text x="1515" y="406" class="node-title small"><tspan x="1515">消费 Agent</tspan><tspan x="1515" dy="27" class="subtle">读取语义、查事实、完成任务</tspan></text>
  <rect x="1370" y="480" width="290" height="90" rx="10" class="acceptance-boundary"/>
  <text x="1515" y="503" class="node-title tiny bold" style="fill:#2c7053">独立验收边界</text>
  <rect x="1385" y="520" width="260" height="48" rx="8" class="node soft"/>
  <text x="1515" y="540" class="node-title tiny"><tspan x="1515">Acceptance</tspan><tspan x="1515" dy="20" class="subtle">只读治理上下文，独立判定</tspan></text>

  <path d="M185 197 V215 H355 V220 H350" class="edge ochre"/>
  <path d="M350 220 H355 V112 H1090 V170" class="edge"/>
  <text x="590" y="64" class="label">Modeling 提交 / 团队自查</text>
  <path d="M640 207 H680" class="edge"/>
  <path d="M790 245 V285 H535 V325" class="edge"/>
  <path d="M1090 245 V285 H855 V305" class="edge"/>
  <text x="970" y="278" class="label">当前变更入口</text>
  <path d="M1090 245 V285 H1175 V325" class="edge"/>
  <text x="1185" y="278" class="label">查询 / 自查</text>
  <path d="M645 372 H690" class="edge"/>
  <path d="M855 430 V465 H600 V490" class="edge"/>
  <path d="M855 430 V465 H1040 V490" class="edge"/>
  <path d="M1175 420 V465 H1040 V490" class="edge"/>
  <path d="M1370 412 H1335 V207 H1230" class="edge"/>
  <path d="M1515 375 V350 H1515 V294" class="edge ochre"/>
  <text x="1580" y="350" class="label">业务查询 / 执行</text>
  <path d="M1385 544 H1305 V420 H1290" class="edge dashed"/>
  <text x="1285" y="460" class="label"><tspan x="1285">只读治理</tspan><tspan x="1285" dy="24">上下文</tspan></text>
  <path d="M185 113 V118 H355 V220 H350" class="edge ochre dashed"/>

  <text x="385" y="614" class="legend">实线＝当前能力与路径　　赭色虚线＝范围尚待确认的规划占位　　独立验收不回写生产链</text>
</svg>
