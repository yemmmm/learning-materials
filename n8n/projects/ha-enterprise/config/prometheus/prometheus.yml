global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - traefik:8080

  - job_name: n8n-main
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n-main-1:5678
          - n8n-main-2:5678

  - job_name: n8n-worker-main-host
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n-worker-1:5678
          - n8n-worker-2:5678

  # --- 宿主机资源监控 (node_exporter) ---
  # 主服务器 11vm：走容器网络访问
  - job_name: node-main
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: '11vm-main'

  # 副服务器 10vm：跨主机走 9100 端口抓取（与 Redis 跨主机访问方式一致）
  - job_name: node-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - li19dksfai10vm.bmwgroup.net:9100
        labels:
          host: '10vm-worker'

  # Remote workers on li19dksfai10vm can be added once their metrics ports are
  # reachable from this host, for example:
  #
  # - job_name: n8n-worker-remote
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #         - li19dksfai10vm.bmwgroup.net:5678
